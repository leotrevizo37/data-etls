# Alertmanager configuration for infrastructure alerts.
# SMTP values are rendered from the Compose environment before startup.

global:
  smtp_smarthost: '__ALERT_SMTP_HOST__:__ALERT_SMTP_PORT__'
  smtp_from: '__ALERT_SMTP_FROM__'
  smtp_auth_username: '__ALERT_SMTP_USER__'
  smtp_auth_password_file: /run/alertmanager/smtp_password
  smtp_require_tls: __ALERT_SMTP_USE_TLS__
  resolve_timeout: 5m

route:
  receiver: email-infra
  group_by: ['alertname', 'user_code']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - receiver: email-infra-bafar-poc-gabinete
      matchers: ['user_code="bafar_poc_gabinete"']
    - receiver: email-infra-valledelencino
      matchers: ['user_code="valledelencino"']
    - receiver: email-infra-carlsjr
      matchers: ['user_code="carlsjr"']
    - receiver: email-infra-emerson
      matchers: ['user_code="emerson"']
    - receiver: email-infra-bafar
      matchers: ['user_code="bafar"']

receivers:
  - name: email-infra
    email_configs:
      - to: '__ALERT_SMTP_TO_INFRASTRUCTURE__'
        send_resolved: true
        headers:
          Subject: >-
            [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}
            {{ if .GroupLabels.user_code }}— {{ .GroupLabels.user_code }}{{ end }}
  - name: email-infra-bafar-poc-gabinete
    email_configs:
      - to: '__ALERT_SMTP_TO_BAFAR_POC_GABINETE_INFRASTRUCTURE__'
        send_resolved: true
  - name: email-infra-valledelencino
    email_configs:
      - to: '__ALERT_SMTP_TO_VALLEDELENCINO_INFRASTRUCTURE__'
        send_resolved: true
  - name: email-infra-carlsjr
    email_configs:
      - to: '__ALERT_SMTP_TO_CARLSJR_INFRASTRUCTURE__'
        send_resolved: true
  - name: email-infra-emerson
    email_configs:
      - to: '__ALERT_SMTP_TO_EMERSON_INFRASTRUCTURE__'
        send_resolved: true
  - name: email-infra-bafar
    email_configs:
      - to: '__ALERT_SMTP_TO_BAFAR_INFRASTRUCTURE__'
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname', 'instance']
