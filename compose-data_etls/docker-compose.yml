      MANTIZ_TEXT_CLASSIFIER_MIN_ACCURACY: ${CARLSJR_MANTIZ_TEXT_CLASSIFIER_MIN_ACCURACY:-0.75}
      MANTIZ_TEXT_CLASSIFIER_MIN_MACRO_F1: ${CARLSJR_MANTIZ_TEXT_CLASSIFIER_MIN_MACRO_F1:-0.70}
      MANTIZ_TEXT_MODEL_BASE_PATH: ${CARLSJR_MANTIZ_TEXT_MODEL_BASE_PATH:-s3a://data-etls/models/carlsjr/mantiz/text_insights}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}
      SPARK_DRIVER_PORT: ${CARLSJR_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${CARLSJR_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${CARLSJR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37129}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${CARLSJR_USER_CODE_PORT:-4006}:4006"
      - "${CARLSJR_SPARK_DRIVER_PORT}:${CARLSJR_SPARK_DRIVER_PORT}"
      - "${CARLSJR_SPARK_BLOCK_MANAGER_PORT}:${CARLSJR_SPARK_BLOCK_MANAGER_PORT}"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4006",
      "-m", "carlsjr.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4006 -h 127.0.0.1"
        ]
      interval: 20s
      timeout: 25s
      retries: 10
      start_period: 40s

  dagster-user-code-emerson:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: emerson-dagster-user-code
    <<: *dagster_common
    depends_on:
      sql-init:
        condition: service_completed_successfully
    working_dir: /opt/dagster/app/emerson
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app/emerson/src
      APP_DB: ${EMERSON_DB:-emerson}
      DIM_DB: ${EMERSON_DIM_DB:-emerson}
      ADLS_CONTAINER_NAME: ${EMERSON_ADLS_CONTAINER_NAME:-emerson}
      FACTREADINGS_OVERLAP_HOURS: ${EMERSON_DEFAULT_FACTREADINGS_OVERLAP_HOURS:-12}
      SPARK_DF_IO_BASE_PATH: ${EMERSON_SPARK_DF_IO_BASE_PATH:-/data/dagster_io/spark_dfs/emerson}
      SPARK_MASTER_URL: "${SPARK_MASTER_URL:-spark://spark-master:${SPARK_MASTER_PORT:-7077}}"
      SPARK_MASTER_STATUS_URL: ${SPARK_MASTER_STATUS_URL:-}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}
      SPARK_DRIVER_PORT: ${EMERSON_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${EMERSON_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${EMERSON_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37139}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${EMERSON_USER_CODE_PORT:-4007}:4007"
      - "${EMERSON_SPARK_DRIVER_PORT}:${EMERSON_SPARK_DRIVER_PORT}"
      - "${EMERSON_SPARK_BLOCK_MANAGER_PORT}:${EMERSON_SPARK_BLOCK_MANAGER_PORT}"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4007",
      "-m", "emerson.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4007 -h 127.0.0.1"
        ]
      interval: 20s
      timeout: 25s
      retries: 10
      start_period: 40s

  dagster-web:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: data-dagster-web
    <<: *dagster_common
    depends_on:
      dagster-user-code-mcd:
        condition: service_healthy
      dagster-user-code-smft:
        condition: service_healthy
      dagster-user-code-mcd-cdp:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
    ports:
      - "${DAGSTER_WEB_PORT:-3000}:3000"
    command: [
      "dagster-webserver",
      "--read-only",
      "-h", "0.0.0.0",
      "-p", "3000",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  dagster-web-admin:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: data-dagster-web-admin
    <<: *dagster_common
    depends_on:
      dagster-user-code-mcd:
        condition: service_healthy
      dagster-user-code-smft:
        condition: service_healthy
      dagster-user-code-mcd-cdp:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DAGSTER_ADMIN_WEB_PORT:-3001}:3000"
    command: [
      "dagster-webserver",
      "-h", "0.0.0.0",
      "-p", "3000",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  dagster-daemon:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: data-dagster-daemon
    <<: *dagster_common
    depends_on:
      dagster-user-code-mcd:
        condition: service_healthy
      dagster-user-code-smft:
        condition: service_healthy
      dagster-user-code-mcd-cdp:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
    command: [
      "dagster-daemon", "run",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  spark-master:
    user: "0:0"
    init: true
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: data-spark-master
    depends_on:
      spark-data-init:
        condition: service_completed_successfully
    command: [
      "/opt/spark/bin/spark-class",
      "org.apache.spark.deploy.master.Master",
      "--host",
      "${SPARK_MASTER_BIND_HOST:-spark-master}",
      "--port",
      "${SPARK_MASTER_PORT:-7077}",
      "--webui-port",
      "8080"
    ]
    environment:
      SPARK_MASTER_BIND_HOST: ${SPARK_MASTER_BIND_HOST:-spark-master}
      SPARK_MASTER_HOST: ${SPARK_MASTER_HOST:-spark-master}
      SPARK_MASTER_PORT: ${SPARK_MASTER_PORT:-7077}
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:${SPARK_MASTER_PORT:-7077}"
    volumes:
      - spark-data:/data
    restart: unless-stopped
    networks:
      - data-dagster
    healthcheck:
      test: [
        "CMD",
        "python3",
        "-c",
        "import os,socket; host=os.environ.get('SPARK_MASTER_BIND_HOST') or os.environ.get('SPARK_MASTER_HOST') or 'localhost'; addr=socket.gethostbyname(host); port=int(os.environ.get('SPARK_MASTER_PORT', '7077')); socket.create_connection((addr, port), 4).close()"
      ]
      interval: 90s
      timeout: 10s
      retries: 10
      start_period: 20s

  spark-worker:
    user: "0:0"
    build:
      context: ..
      dockerfile: spark/Dockerfile
    depends_on:
      spark-master:
        condition: service_started
      spark-data-init:
        condition: service_completed_successfully
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEM}
      - "SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=${SPARK_WORKER_CLEANUP_ENABLED:-true} -Dspark.worker.cleanup.interval=${SPARK_WORKER_CLEANUP_INTERVAL_SECONDS:-1800} -Dspark.worker.cleanup.appDataTtl=${SPARK_WORKER_CLEANUP_APP_DATA_TTL_SECONDS:-10800}"
    ports:
      - "${MCD_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37079}:${MCD_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37079}"
      - "${SMFT_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37089}:${SMFT_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37089}"
      - "${CDP_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37099}:${CDP_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37099}"
      - "${GAB_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37109}:${GAB_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37109}"
      - "${VALLEDELENCINO_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37119}:${VALLEDELENCINO_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37119}"
      - "${CARLSJR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37129}:${CARLSJR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37129}"
      - "${EMERSON_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37139}:${EMERSON_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37139}"
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:${SPARK_MASTER_PORT:-7077}"
      ]
    volumes:
      - spark-data:/data
    networks:
      - data-dagster
    restart: unless-stopped

  spark-data-init:
    image: alpine:3.20
    user: "0:0"
    container_name: spark-data-init
    volumes:
      - spark-data:/data
    command: ["sh", "-c", "mkdir -p /data/dagster_io/spark_dfs && chmod -R 777 /data"]
    restart: "no"
    networks:
      - data-dagster

volumes:
  spark-data:
  dagster_postgres_data:

networks:
  data-dagster:
    driver: bridge
