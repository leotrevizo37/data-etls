      PYTHONPATH: /opt/dagster/app/bafar_poc_gabinete/src
      APP_DB: ${GABINETE_DB:-cdp}
      DIM_DB: ${GABINETE_DIM_DB:-cdp}
      ADLS_CONTAINER_NAME: ${GABINETE_ADLS_CONTAINER_NAME:-cdp}
      FACTREADINGS_OVERLAP_HOURS: ${GABINETE_DEFAULT_FACTREADINGS_OVERLAP_HOURS:-12}
      FACTREDINGSAUDITS_OVERLAP_HOURS: ${GABINETE_DEFAULT_FACTREDINGSAUDITS_OVERLAP_HOURS:-1}
      SPARK_DF_IO_BASE_PATH: ${GABINETE_SPARK_DF_IO_BASE_PATH:-/data/dagster_io/spark_dfs/bafar_poc_gabinete}
      SPARK_MASTER_URL: "${SPARK_MASTER_URL:-spark://spark-master:${SPARK_MASTER_PORT:-7077}}"
      SPARK_MASTER_STATUS_URL: ${SPARK_MASTER_STATUS_URL:-}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}
      SPARK_OBSERVABILITY_DRIVER_PORT: ${GAB_OBSERVABILITY_SPARK_DRIVER_PORT:-37104}
      SPARK_OBSERVABILITY_DRIVER_BLOCK_MANAGER_PORT: ${GAB_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37105}
      SPARK_OBSERVABILITY_BLOCK_MANAGER_PORT: ${GAB_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37106}
      SPARK_DRIVER_PORT: ${GAB_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${GAB_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${GAB_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37109}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${GABINETE_USER_CODE_PORT:-4004}:4004"
      - "${GAB_OBSERVABILITY_SPARK_DRIVER_PORT:-37104}:${GAB_OBSERVABILITY_SPARK_DRIVER_PORT:-37104}"
      - "${GAB_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37105}:${GAB_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37105}"
      - "${GAB_SPARK_DRIVER_PORT}:${GAB_SPARK_DRIVER_PORT}"
      - "${GAB_SPARK_BLOCK_MANAGER_PORT}:${GAB_SPARK_BLOCK_MANAGER_PORT}"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4004",
      "-m", "bafar_poc_gabinete.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4004 -h 127.0.0.1"
