x-dagster-common: &dagster_common
  env_file:
    - ${COMPOSE_ENV_FILE:-.env}
  environment:
    DAGSTER_HOME: /opt/dagster/dagster_home
  working_dir: /opt/dagster/app
  volumes:
    - ../dagster/dagster_home:/opt/dagster/dagster_home
    - ../dagster/mcdonalds:/opt/dagster/app/mcdonalds
    - ../dagster/smartfit:/opt/dagster/app/smartfit
    - ../dagster/mcdonalds_cdp:/opt/dagster/app/mcdonalds_cdp
    - ../dagster/bafar_poc_gabinete:/opt/dagster/app/bafar_poc_gabinete
    - ../dagster/valledelencino:/opt/dagster/app/valledelencino
    - ../dagster/carlsjr:/opt/dagster/app/carlsjr
    - ../dagster/emerson:/opt/dagster/app/emerson
    - ../workspace.yaml:/opt/dagster/app/workspace.yaml:ro
    - spark-data:/data
  networks:
    - data-dagster
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  sql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: data-sql-init
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    networks:
      - data-dagster
    volumes:
      - ../sql/init:/sql/init:ro
      - ../sql/procedures:/sql/procedures:ro
      - ../sql/user_codes:/sql/user_codes:ro
    command:
      - sh
      - -c
      - |
          set -eu

          SQLCMD=/opt/mssql-tools/bin/sqlcmd

          echo "Waiting for SQL Server at $${MSSQL_HOST}:$${MSSQL_PORT:-1433}..."
          until "$$SQLCMD" \
                    -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                    -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                    -Q "SELECT 1" >/dev/null 2>&1; do
            echo "SQL Server not ready, retrying in 5s..."
            sleep 5
          done

          USER_CODE_DBS="$${USER_CODE_DBS:-mcdonalds=mcdonalds smartfit=smartfit mcdonalds_cdp=mcdonaldscdp valledelencino=valledelencino carlsjr=carlsjr emerson=emerson}"

          for db_spec in $$USER_CODE_DBS; do
            case "$$db_spec" in
              *=*)
                USER_CODE="$${db_spec%%=*}"
                APP_DB="$${db_spec#*=}"
                ;;
              *)
                USER_CODE="$$db_spec"
                APP_DB="$$db_spec"
                ;;
            esac

            if [ -z "$$USER_CODE" ] || [ -z "$$APP_DB" ]; then
              echo "Invalid USER_CODE_DBS entry: '$$db_spec'"
              exit 1
            fi

            APP_DB_SQLSTRING=$$(printf "%s" "$$APP_DB" | sed "s/'/''/g")
            APP_DB_IDENTIFIER=$$(printf "%s" "$$APP_DB" | sed "s/]/]]/g")

            echo "Ensuring database $$APP_DB exists for user_code $$USER_CODE..."
            "$$SQLCMD" \
                -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                -d master \
                -b \
                -Q "IF DB_ID(N'$$APP_DB_SQLSTRING') IS NULL EXEC(N'CREATE DATABASE [$$APP_DB_IDENTIFIER]');"

            echo "Running SQL init scripts for $$USER_CODE from /sql/init and /sql/procedures..."
            for f in /sql/init/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              "$$SQLCMD" \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done

            for f in /sql/procedures/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              "$$SQLCMD" \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done

            for f in /sql/user_codes/"$$USER_CODE"/init/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              "$$SQLCMD" \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done

            for f in /sql/user_codes/"$$USER_CODE"/procedures/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              "$$SQLCMD" \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done
          done

          echo "SQL init completed."
    restart: "no"

  dagster-postgres:
    image: postgres:16
    container_name: data-dagster-postgres
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USER}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    ports:
      - "127.0.0.1:${DAGSTER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    networks:
      - data-dagster
    depends_on:
      sql-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USER} -d ${DAGSTER_PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dagster-user-code-mcd:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: mcdonalds-dagster-user-code
    <<: *dagster_common
    depends_on:
      sql-init:
        condition: service_completed_successfully
    working_dir: /opt/dagster/app/mcdonalds
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app/mcdonalds/src
      APP_DB: ${MCDONALDS_DB:-mcdonalds}
      DIM_DB: ${MCDONALDS_DIM_DB:-mcdonalds}
      ADLS_CONTAINER_NAME: ${MCDONALDS_ADLS_CONTAINER_NAME:-mcdonalds}
      FACTREADINGS_OVERLAP_HOURS: ${MCDONALDS_DEFAULT_FACTREADINGS_OVERLAP_HOURS:-12}
      SPARK_DF_IO_BASE_PATH: ${MCDONALDS_SPARK_DF_IO_BASE_PATH:-/data/dagster_io/spark_dfs/mcdonalds}
      SPARK_MASTER_URL: "${SPARK_MASTER_URL:-spark://spark-master:${SPARK_MASTER_PORT:-7077}}"
      SPARK_MASTER_STATUS_URL: ${SPARK_MASTER_STATUS_URL:-}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}
      SPARK_DRIVER_PORT: ${MCD_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${MCD_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${MCD_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37079}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${MCDONALDS_USER_CODE_PORT:-4001}:4001"
      - "${MCD_SPARK_DRIVER_PORT}:${MCD_SPARK_DRIVER_PORT}"
      - "${MCD_SPARK_BLOCK_MANAGER_PORT}:${MCD_SPARK_BLOCK_MANAGER_PORT}"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4001",
      "-m", "mcdonalds.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4001 -h 127.0.0.1"
        ]
      interval: 20s
      timeout: 25s
      retries: 10
      start_period: 20s

