      MQTT_EVENT_HISTORY_API_TIMEOUT_SECONDS: ${EMERSON_MQTT_EVENT_HISTORY_API_TIMEOUT_SECONDS:-60}
      MQTT_EVENT_HISTORY_API_LIMIT: ${EMERSON_MQTT_EVENT_HISTORY_API_LIMIT:-5000}
      MQTT_EVENT_HISTORY_API_REQUESTS_PER_MINUTE: ${EMERSON_MQTT_EVENT_HISTORY_API_REQUESTS_PER_MINUTE:-95}
      MQTT_EVENT_HISTORY_LOOKBACK_HOURS: ${EMERSON_MQTT_EVENT_HISTORY_LOOKBACK_HOURS:-6}
      MQTT_EVENT_HISTORY_REJECTED_ROW_RETENTION_DAYS: ${EMERSON_MQTT_EVENT_HISTORY_REJECTED_ROW_RETENTION_DAYS:-30}
      SPARK_DF_IO_BASE_PATH: ${EMERSON_SPARK_DF_IO_BASE_PATH:-/data/dagster_io/spark_dfs/emerson}
      SPARK_MASTER_URL: "${SPARK_MASTER_URL:-spark://spark-master:${SPARK_MASTER_PORT:-7077}}"
      SPARK_MASTER_STATUS_URL: ${SPARK_MASTER_STATUS_URL:-}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}
      SPARK_OBSERVABILITY_DRIVER_PORT: ${EMERSON_OBSERVABILITY_SPARK_DRIVER_PORT:-37134}
      SPARK_OBSERVABILITY_DRIVER_BLOCK_MANAGER_PORT: ${EMERSON_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37135}
      SPARK_OBSERVABILITY_BLOCK_MANAGER_PORT: ${EMERSON_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37136}
      SPARK_DRIVER_PORT: ${EMERSON_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${EMERSON_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${EMERSON_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37139}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${EMERSON_USER_CODE_PORT:-4007}:4007"
      - "${EMERSON_OBSERVABILITY_SPARK_DRIVER_PORT:-37134}:${EMERSON_OBSERVABILITY_SPARK_DRIVER_PORT:-37134}"
      - "${EMERSON_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37135}:${EMERSON_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37135}"
      - "${EMERSON_SPARK_DRIVER_PORT}:${EMERSON_SPARK_DRIVER_PORT}"
      - "${EMERSON_SPARK_BLOCK_MANAGER_PORT}:${EMERSON_SPARK_BLOCK_MANAGER_PORT}"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4007",
      "-m", "emerson.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4007 -h 127.0.0.1"
        ]
      interval: 20s
      timeout: 25s
      retries: 10
      start_period: 40s

  dagster-user-code-bafar:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: bafar-dagster-user-code
    <<: *dagster_common
    depends_on:
      sql-init:
        condition: service_completed_successfully
    working_dir: /opt/dagster/app/bafar
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app/bafar/src
      APP_DB: ${BAFAR_DB:-bafar}
      DIM_DB: ${BAFAR_DIM_DB}
      SPARK_DF_IO_BASE_PATH: ${BAFAR_SPARK_DF_IO_BASE_PATH:-/data/dagster_io/spark_dfs/bafar}
      SPARK_MASTER_URL: "${SPARK_MASTER_URL:-spark://spark-master:${SPARK_MASTER_PORT:-7077}}"
      SPARK_MASTER_STATUS_URL: ${SPARK_MASTER_STATUS_URL:-}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      DIMSQL_HOST: ${BAFAR_DIMSQL_HOST}
      DIMSQL_PORT: ${BAFAR_DIMSQL_PORT:-1433}
      DIMSQL_USER: ${BAFAR_DIMSQL_USER}
      DIMSQL_PASSWORD: ${BAFAR_DIMSQL_PASSWORD}
      DIMSQL_CONNECT_TIMEOUT: ${BAFAR_DIMSQL_CONNECT_TIMEOUT:-15}
      DIMSQL_COMMAND_TIMEOUT: ${BAFAR_DIMSQL_COMMAND_TIMEOUT:-5000}
      DIMSQL_DRIVER: ${BAFAR_DIMSQL_DRIVER:-ODBC Driver 18 for SQL Server}
      DIMSQL_CONNECT_RETRY_COUNT: ${BAFAR_DIMSQL_CONNECT_RETRY_COUNT:-3}
      DIMSQL_CONNECT_RETRY_INTERVAL: ${BAFAR_DIMSQL_CONNECT_RETRY_INTERVAL:-60}
      BAFAR_MANAGER_ACCESS_API_URL: ${BAFAR_MANAGER_ACCESS_API_URL}
      BAFAR_MANAGER_ACCESS_API_USER: ${BAFAR_MANAGER_ACCESS_API_USER}
      BAFAR_MANAGER_ACCESS_API_PASSWORD: ${BAFAR_MANAGER_ACCESS_API_PASSWORD}
      BAFAR_MANAGER_ACCESS_API_TIMEOUT_SECONDS: ${BAFAR_MANAGER_ACCESS_API_TIMEOUT_SECONDS:-30}
      BAFAR_STORE_SCHEDULES_API_URL: ${BAFAR_STORE_SCHEDULES_API_URL}
      BAFAR_STORE_SCHEDULES_API_USER: ${BAFAR_STORE_SCHEDULES_API_USER}
      BAFAR_STORE_SCHEDULES_API_PASSWORD: ${BAFAR_STORE_SCHEDULES_API_PASSWORD}
      BAFAR_STORE_SCHEDULES_API_TIMEOUT_SECONDS: ${BAFAR_STORE_SCHEDULES_API_TIMEOUT_SECONDS:-30}
      BAFAR_STORE_SCHEDULES_API_PAGE_SIZE: ${BAFAR_STORE_SCHEDULES_API_PAGE_SIZE:-100}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST}
      SPARK_DRIVER_BIND_ADDRESS: ${SPARK_DRIVER_BIND_ADDRESS}
      SPARK_OBSERVABILITY_DRIVER_PORT: ${BAFAR_OBSERVABILITY_SPARK_DRIVER_PORT:-37144}
      SPARK_OBSERVABILITY_DRIVER_BLOCK_MANAGER_PORT: ${BAFAR_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37145}
      SPARK_OBSERVABILITY_BLOCK_MANAGER_PORT: ${BAFAR_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37146}
      SPARK_DRIVER_PORT: ${BAFAR_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${BAFAR_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${BAFAR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37149}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${BAFAR_USER_CODE_PORT:-4008}:4008"
      - "${BAFAR_OBSERVABILITY_SPARK_DRIVER_PORT:-37144}:${BAFAR_OBSERVABILITY_SPARK_DRIVER_PORT:-37144}"
      - "${BAFAR_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37145}:${BAFAR_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37145}"
      - "${BAFAR_SPARK_DRIVER_PORT}:${BAFAR_SPARK_DRIVER_PORT}"
      - "${BAFAR_SPARK_BLOCK_MANAGER_PORT}:${BAFAR_SPARK_BLOCK_MANAGER_PORT}"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4008",
      "-m", "bafar.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4008 -h 127.0.0.1"
        ]
      interval: 20s
      timeout: 25s
      retries: 10
      start_period: 40s

  dagster-web:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: data-dagster-web
    <<: *dagster_common
    depends_on:
      dagster-postgres:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
    ports:
      - "${DAGSTER_WEB_PORT:-3000}:3000"
    command: [
      "dagster-webserver",
      "--read-only",
      "-h", "0.0.0.0",
      "-p", "3000",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  dagster-web-admin:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: data-dagster-web-admin
    <<: *dagster_common
    depends_on:
      dagster-postgres:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DAGSTER_ADMIN_WEB_PORT:-3001}:3000"
    command: [
      "dagster-webserver",
      "-h", "0.0.0.0",
      "-p", "3000",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  dagster-daemon:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: data-dagster-daemon
    <<: *dagster_common
    depends_on:
      dagster-user-code-bafar-poc-gabinete:
        condition: service_healthy
      dagster-user-code-valledelencino:
        condition: service_healthy
      dagster-user-code-carlsjr:
        condition: service_healthy
      dagster-user-code-emerson:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
    command: [
      "dagster-daemon", "run",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: data-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "127.0.0.1:${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data-dagster
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: data-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets.yml:/etc/prometheus/targets.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - data-dagster
    depends_on:
      blackbox-exporter:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  spark-master:
    user: "0:0"
    init: true
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: data-spark-master
    depends_on:
      spark-data-init:
        condition: service_completed_successfully
    command: [
      "/opt/spark/bin/spark-class",
      "org.apache.spark.deploy.master.Master",
      "--host",
      "${SPARK_MASTER_BIND_HOST:-spark-master}",
      "--port",
      "${SPARK_MASTER_PORT:-7077}",
      "--webui-port",
      "8080"
    ]
    environment:
      SPARK_MASTER_BIND_HOST: ${SPARK_MASTER_BIND_HOST:-spark-master}
      SPARK_MASTER_HOST: ${SPARK_MASTER_HOST:-spark-master}
      SPARK_MASTER_PORT: ${SPARK_MASTER_PORT:-7077}
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:${SPARK_MASTER_PORT:-7077}"
    volumes:
      - spark-data:/data
    restart: unless-stopped
    networks:
      - data-dagster
    healthcheck:
      test: [
        "CMD",
        "python3",
        "-c",
        "import os,socket; host=os.environ.get('SPARK_MASTER_BIND_HOST') or os.environ.get('SPARK_MASTER_HOST') or 'localhost'; addr=socket.gethostbyname(host); port=int(os.environ.get('SPARK_MASTER_PORT', '7077')); socket.create_connection((addr, port), 4).close()"
      ]
      interval: 90s
      timeout: 10s
      retries: 10
      start_period: 20s

  spark-worker:
    user: "0:0"
    build:
      context: ..
      dockerfile: spark/Dockerfile
    depends_on:
      spark-master:
        condition: service_started
      spark-data-init:
        condition: service_completed_successfully
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEM}
      - "SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=${SPARK_WORKER_CLEANUP_ENABLED:-true} -Dspark.worker.cleanup.interval=${SPARK_WORKER_CLEANUP_INTERVAL_SECONDS:-1800} -Dspark.worker.cleanup.appDataTtl=${SPARK_WORKER_CLEANUP_APP_DATA_TTL_SECONDS:-10800}"
    ports:
      - "${GAB_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37106}:${GAB_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37106}"
      - "${GAB_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37109}:${GAB_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37109}"
      - "${VALLEDELENCINO_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37116}:${VALLEDELENCINO_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37116}"
      - "${VALLEDELENCINO_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37119}:${VALLEDELENCINO_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37119}"
      - "${CARLSJR_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37126}:${CARLSJR_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37126}"
      - "${CARLSJR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37129}:${CARLSJR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37129}"
      - "${EMERSON_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37136}:${EMERSON_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37136}"
      - "${EMERSON_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37139}:${EMERSON_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37139}"
      - "${BAFAR_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37146}:${BAFAR_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37146}"
      - "${BAFAR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37149}:${BAFAR_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37149}"
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:${SPARK_MASTER_PORT:-7077}"
      ]
    volumes:
      - spark-data:/data
    networks:
      - data-dagster
    restart: unless-stopped

  spark-data-init:
    image: alpine:3.20
    user: "0:0"
    container_name: spark-data-init
    volumes:
      - spark-data:/data
    command: ["sh", "-c", "mkdir -p /data/dagster_io/spark_dfs && chmod -R 777 /data"]
    restart: "no"
    networks:
      - data-dagster

volumes:
  spark-data:
  dagster_postgres_data:
  prometheus_data:

networks:
  data-dagster:
    driver: bridge
