x-dagster-common: &dagster_common
  env_file:
    - .env
  environment:
    DAGSTER_HOME: /opt/dagster/dagster_home
    PYTHONPATH: /opt/dagster/app/mcdonalds/src
  working_dir: /opt/dagster/app/mcdonalds
  volumes:
    - ../dagster/dagster_home:/opt/dagster/dagster_home
    - ../dagster/mcdonalds:/opt/dagster/app/mcdonalds
    - ../workspace.yaml:/opt/dagster/app/workspace.yaml:ro
  networks:
    - mcdonalds-dagster
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  dagster-postgres:
    image: postgres:16
    container_name: mcdonalds-dagster-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USER}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    networks:
      - mcdonalds-dagster
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USER} -d ${DAGSTER_PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dagster-user-code:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: mcdonalds-dagster-user-code
    <<: *dagster_common
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app/mcdonalds/src
      APP_DB: ${APP_DB}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "${USER_CODE_PORT:-4000}:4001"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4001",
      "-m", "mcdonalds.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4001 -h 127.0.0.1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dagster-web:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: mcdonalds-dagster-web
    <<: *dagster_common
    depends_on:
      dagster-user-code:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
    ports:
      - "${DAGSTER_WEB_PORT:-3000}:3000"
    command: [
      "dagster-webserver",
      "-h", "0.0.0.0",
      "-p", "3000",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  dagster-daemon:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: mcdonalds-dagster-daemon
    <<: *dagster_common
    depends_on:
      dagster-user-code:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
    command: [
      "dagster-daemon", "run",
      "-w", "/opt/dagster/app/workspace.yaml"
    ]

  spark-master:
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: mcdonalds-spark-master
    command: [
      "/opt/spark/bin/spark-class",
      "org.apache.spark.deploy.master.Master"
    ]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - spark-data:/data
    restart: unless-stopped
    networks:
      - mcdonalds-dagster
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket,sys; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\",7077)); s.close()'"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker:
    build:
      context: ..
      dockerfile: spark/Dockerfile
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEM}
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077"
      ]
    volumes:
      - spark-data:/data
    networks:
      - mcdonalds-dagster
    restart: unless-stopped

volumes:
  spark-data:
  dagster_postgres_data:

networks:
  mcdonalds-dagster:
    driver: bridge
