name: Deploy Production

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - data-etls-production
      - production-deploy
    steps:
      - name: Update repo and restart production containers
        run: |
          cd /srv/data-etls-production
          git fetch origin
          git reset --hard origin/main
          docker compose --env-file compose-data_etls/.env -f compose-data_etls/docker-compose.yml up -d -build
