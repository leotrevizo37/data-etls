name: Deploy Staging

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on:
      - self-hosted
      - data-etls-staging

    steps:
      - name: Deploy on VM
        run: |
          cd /home/warehouse/data-etls
          git fetch origin
          git reset --hard origin/main
          docker compose --env-file compose-data_etls/.env -f compose-data_etls/docker-compose.yml
