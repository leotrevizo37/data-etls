name: Deploy Staging

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    environment: staging
    concurrency:
      group: data-etls-staging
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - staging-deploy

    steps:
      - name: Deploy on VM
        shell: bash
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          
          cd /home/warehouse/data-etls
          git fetch origin
          git reset --hard origin/main

          test -n "${STAGING_ENV_FILE:-}"

          umask 077
          printf '%s\n' "STAGING_ENV_FILE" > compose-data_etls/.env.next

          docker compose \
            --env-file compose-data_etls/.env.next \
            -f compose-data_etls/docker-compose.yml \
            config --quiet

          cp compose-data_etls/.env compose-data_etls/.env.backup 2>/dev/null || true
          mv compose-data_etls/.env.next compose-data_etls/.env

          docker compose \
            --env-file compose-data_etls/.env \
            -f compose-data_etls/docker-compose.yml \
            up -d --build
