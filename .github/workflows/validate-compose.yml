name: Validate compose

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  compose-validate:
    name: Compose mocking and validation
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'init/') || startsWith(github.head_ref, 'feat/') || github.head_ref == 'development'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for validation
        run: cp compose-data_etls/.env.example compose-data_etls/.env

      - name: Validate compose
        run: docker compose -f compose-data_etls/docker-compose.yml config
