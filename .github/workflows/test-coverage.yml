name: test-coverage.yml

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    if: github.base_ref == 'stage' || github.base_ref == 'main'
    defaults:
      run:
        working-directory: dagster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            dagster/requirements.txt
            dagster/bafar_poc_gabinete/pyproject.toml
            dagster/carlsjr/pyproject.toml
            dagster/valledelencino/pyproject.toml
            dagster/alerting/pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install coverage pytest
          pip install -e bafar_poc_gabinete
          pip install -e carlsjr
          pip install -e valledelencino
          pip install -e alerting

      - name: Run tests with coverage
        env:
          PYTHONWARNINGS: ignore::ResourceWarning
        run: |
          python -m coverage erase
          (cd bafar_poc_gabinete && python -m coverage run --parallel-mode --source=src/bafar_poc_gabinete -m unittest discover tests -p "test_*.py")
          (cd carlsjr && python -m coverage run --parallel-mode --source=src/carlsjr -m unittest discover tests -p "test_*.py")
          (cd valledelencino && python -m coverage run --parallel-mode --source=src/valledelencino -m unittest discover tests -p "test_*.py")
          (cd alerting && python -m coverage run --parallel-mode --source=src/alerting -m unittest discover tests -p "test_*.py")
          python -m coverage combine bafar_poc_gabinete carlsjr valledelencino alerting
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: dagster/coverage.xml
          if-no-files-found: error
