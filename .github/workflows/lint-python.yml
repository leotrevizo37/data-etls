name: ci-python.yml

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  python:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'init/') || startsWith(github.head_ref, 'feat/') || github.head_ref == 'stage'
    defaults:
      run:
        working-directory: dagster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dagster/requirements.txt

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff==0.16.0 pytest
          pip install -e mcdonalds
          pip install -e smartfit
          pip install -e mcdonalds_cdp
          pip install -e bafar
          pip install -e bafar_poc_gabinete
          pip install -e carlsjr
          pip install -e emerson
          pip install -e valledelencino

      - name: Ruff
        run: ruff check --select E4,E7,E9,F .

      - name: Tests
        run: |
          (cd bafar_poc_gabinete && pytest -q)
          (cd carlsjr && pytest -q)
          (cd mcdonalds && pytest -q)
          (cd mcdonalds_cdp && pytest -q)
          (cd smartfit && pytest -q)
          (cd valledelencino && pytest -q)
