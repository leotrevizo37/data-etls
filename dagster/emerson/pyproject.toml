[project]
name = "emerson"
requires-python = ">=3.10,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.13.28",
    "pyodbc>=5.3.0",
    "pyspark>=4.2.0",
]

[dependency-groups]
dev = [
    "dagster-webserver==1.13.28",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "emerson"
registry_modules = [
    "emerson.components.*",
]


