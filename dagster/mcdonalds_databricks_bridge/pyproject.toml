[project]
name = "mcdonalds_databricks_bridge"
requires-python = ">=3.10,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.12.6",
    "dagster-postgres==0.28.6",
    "python-dotenv",
    "pyodbc>=5.3.0",
    "pyarrow",
    "databricks-sql-connector[pyarrow]==4.2.5",
    "databricks-sdk==0.102.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "mcdonalds_databricks_bridge"
registry_modules = [
    "mcdonalds_databricks_bridge.components.*",
]
